apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: twitch-recorder

resources:
  - namespace.yaml
  - otel-collector.yaml
  - jaeger.yaml
  - prometheus.yaml
  - loki.yaml
  - grafana.yaml
  - deployment.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - ../observability/grafana/dashboards/twitch-recorder.json

generatorOptions:
  disableNameSuffixHash: true

commonLabels:
  app.kubernetes.io/part-of: twitch-stream-recorder
