apiVersion: v1
kind: ServiceAccount
metadata:
  name: twitch-recorder
  namespace: twitch-recorder
  labels:
    app.kubernetes.io/name: twitch-stream-recorder
    app.kubernetes.io/component: recorder
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: twitch-recorder-config
  namespace: twitch-recorder
  labels:
    app.kubernetes.io/name: twitch-stream-recorder
    app.kubernetes.io/component: recorder
data:
  username: "forsen"
  quality: "best"
  OTEL_SERVICE_NAME: "twitch-stream-recorder"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.twitch-recorder.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production,service.namespace=twitch"
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  OTEL_ENABLED: "true"
  DISK_FREE_WARNING_RATIO: "0.10"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: twitch-recorder-archive
  namespace: twitch-recorder
  labels:
    app.kubernetes.io/name: twitch-stream-recorder
    app.kubernetes.io/component: recorder
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitch-recorder
  namespace: twitch-recorder
  labels:
    app.kubernetes.io/name: twitch-stream-recorder
    app.kubernetes.io/component: recorder
spec:
  replicas: 1
  # Recordings write to a RWO volume, so the old pod must release it first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: twitch-stream-recorder
      app.kubernetes.io/component: recorder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twitch-stream-recorder
        app.kubernetes.io/component: recorder
      annotations:
        # Roll the pods when telemetry configuration changes.
        checksum/config: "replace-with-configmap-hash"
    spec:
      serviceAccountName: twitch-recorder
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: recorder
          image: ghcr.io/civon/twitch-stream-recorder:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: twitch-recorder-config
            - secretRef:
                name: twitch-recorder-credentials
          env:
            # Declared before OTEL_RESOURCE_ATTRIBUTES so that $(VAR) expansion
            # can reference them, and overriding the ConfigMap value.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,service.namespace=twitch,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
          volumeMounts:
            - name: archive
              mountPath: /app/rec
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: twitch-recorder-archive
