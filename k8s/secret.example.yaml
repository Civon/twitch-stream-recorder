# Copy to secret.yaml, fill in real values, and keep it out of version control:
#   kubectl create secret generic twitch-recorder-credentials \
#     --namespace twitch-recorder \
#     --from-literal=client_id=... \
#     --from-literal=client_secret=... \
#     --from-literal=twitch_oauth_token=...
apiVersion: v1
kind: Secret
metadata:
  name: twitch-recorder-credentials
  namespace: twitch-recorder
  labels:
    app.kubernetes.io/name: twitch-stream-recorder
    app.kubernetes.io/component: recorder
type: Opaque
stringData:
  client_id: "replace-me"
  client_secret: "replace-me"
  # Optional; leave empty when not using a personal OAuth token.
  twitch_oauth_token: ""
