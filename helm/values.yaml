# ==============================================================================
# Twitch Stream Recorder - Base Configuration
# ==============================================================================
# This file contains common settings and defaults.
# Use values.override.yaml for environment-specific configuration.
#
# Deploy with:
  # helm upgrade twitch-stream-recorder ./helm \
  #   -f ./helm/values.yaml \
  #   -f ./helm/values.override.yaml \
  #   --namespace twitch-stream-recorder

replicaCount: 1

# Docker image configuration
image:
  repository: ghcr.io/civon/twitch-stream-recorder
  tag: 2.4
  pullPolicy: IfNotPresent

# Kubernetes namespace
namespace:
  name: twitch-stream-recorder

# Channels to record
# Override this in values.override.yaml with your actual channels
channels: []
# Example:
# - name: streamer_name
#   quality: best            # Options: best, 1080p, 720p, 480p, 360p, worst, audio_only

# ConfigMap settings
configmap:
  quality: "480p"

# Twitch API secrets
# Override these in values.override.yaml or values.secrets.yaml
secrets:
  name: twitch-stream-recorder-secrets
  client_id: "CHANGE_ME"
  client_secret: "CHANGE_ME"
  twitch_oauth_token: "CHANGE_ME" # optional, able to skip ads if you have subscription

# Service configuration (internal)
service:
  type: ClusterIP
  port: 80

# Resource limits and requests per channel
resources:
  limits:
    cpu: "100m"
    memory: "512Mi"
  requests:
    cpu: "14m"
    memory: "3Mi"

# Persistent storage for recorded videos
storage:
  size: "50Gi"
  storageClassName: "local-path"

# Export service for accessing/downloading videos via web
export:
  enabled: true
  service:
    type: NodePort
    port: 8080

# Additional volumes on the output Deployment definition
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity rules for pod assignment
affinity: {}

# ==============================================================================
# Quality Options Reference:
# ==============================================================================
# - best        : Highest quality available (typically 1080p60)
# - 1080p60     : 1080p at 60fps
# - 1080p       : 1080p at 30fps
# - 720p60      : 720p at 60fps
# - 720p        : 720p at 30fps
# - 480p        : 480p
# - 360p        : 360p
# - 160p        : 160p
# - worst       : Lowest quality (typically 160p)
# - audio_only  : Audio stream only
#
# Storage estimates per hour:
# - 1080p60:    3-4 GB/hour
# - 720p:       1-2 GB/hour
# - 480p:       0.5-1 GB/hour
# - worst:      0.2-0.5 GB/hour
# ==============================================================================
