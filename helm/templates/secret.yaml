apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  client_id: "{{ .Values.secrets.client_id }}"
  client_secret: "{{ .Values.secrets.client_secret }}"
  twitch_oauth_token: "{{ .Values.secrets.twitch_oauth_token }}"


